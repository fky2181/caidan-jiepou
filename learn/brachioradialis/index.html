<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肱桡肌解剖学习 · 菜蛋解剖</title><meta name="description" content="位于前臂外侧浅层，名字提示了肱骨与桡骨之间的连接。"><link rel="canonical" href="https://fky2181.github.io/caidan-jiepou/learn/brachioradialis/"><link rel="stylesheet" href="/caidan-jiepou/learn/reading.css"></head><body><header><a href="/caidan-jiepou/">菜蛋解剖</a><nav><a href="/caidan-jiepou/learn/">学习目录</a><a href="/caidan-jiepou/">打开三维图谱</a></nav></header><main><p class="meta">上肢 · 肌肉</p><h1>肱桡肌</h1><p class="intro">位于前臂外侧浅层，名字提示了肱骨与桡骨之间的连接。</p><a class="open" href="/caidan-jiepou/?structure=brachioradialis">在三维图谱中学习</a><h2>起点</h2><p>肱骨外侧髁上嵴。</p><h2>止点</h2><p>桡骨远端、茎突近侧。</p><h2>主要动作</h2><p>屈肘，前臂处于中立位时作用明显。</p><h2>神经支配</h2><p>桡神经。</p><h2>理解线索</h2><p>它是“桡神经只支配伸肌”这种过度简化记法的反例，应该按具体肌肉学习。</p><h2>关联结构</h2><ul><li>起点所在骨：<a href="/caidan-jiepou/learn/humerus/">肱骨</a></li><li>止点所在骨：<a href="/caidan-jiepou/learn/radius/">桡骨</a></li><li>支配神经：<a href="/caidan-jiepou/learn/radial-nerve/">桡神经</a></li></ul><h2>教材参考与来源</h2><ul><li><a href="https://medicine.uams.edu/neuroscience/education/medical-school-courses/human-structure-module/anatomy-tables/muscle-tables/muscles-of-the-upper-limb/" rel="noreferrer">阿肯色医学科学大学 · 上肢肌解剖表</a></li></ul></main><footer>菜蛋解剖 · 骨肌神经学习<br>知识卡为教学摘要，来源可核对；图谱为静态成年男性参考模型。</footer></body></html>
