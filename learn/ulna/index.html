<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尺骨解剖学习 · 菜蛋解剖</title><meta name="description" content="解剖学姿势下位于前臂内侧、小指侧。"><link rel="canonical" href="https://fky2181.github.io/caidan-jiepou/learn/ulna/"><link rel="stylesheet" href="/caidan-jiepou/learn/reading.css"></head><body><header><a href="/caidan-jiepou/">菜蛋解剖</a><nav><a href="/caidan-jiepou/learn/">学习目录</a><a href="/caidan-jiepou/">打开三维图谱</a></nav></header><main><p class="meta">上肢 · 骨骼</p><h1>尺骨</h1><p class="intro">解剖学姿势下位于前臂内侧、小指侧。</p><a class="open" href="/caidan-jiepou/?structure=ulna">在三维图谱中学习</a><h2>位置与结构</h2><p>解剖学姿势下位于前臂内侧、小指侧。</p><h2>主要标志</h2><p>鹰嘴、冠突、滑车切迹与茎突。</p><h2>理解线索</h2><p>先找肘后的鹰嘴，再把肱三头肌的止点与伸肘联系起来。</p><h2>关联结构</h2><ul><li>相关附着肌肉：<a href="/caidan-jiepou/learn/triceps/">肱三头肌</a></li><li>相关附着肌肉：<a href="/caidan-jiepou/learn/brachialis/">肱肌</a></li></ul><h2>教材参考与来源</h2><ul><li><a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/8-2-bones-of-the-upper-limb" rel="noreferrer">开放教材 · 上肢骨</a></li></ul></main><footer>菜蛋解剖 · 骨肌神经学习<br>知识卡为教学摘要，来源可核对；图谱为静态成年男性参考模型。</footer></body></html>
