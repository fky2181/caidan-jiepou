<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肩胛下肌解剖学习 · 菜蛋解剖</title><meta name="description" content="位于肩胛骨前面的肩胛下窝，是肩袖的组成肌之一。"><link rel="canonical" href="https://fky2181.github.io/caidan-jiepou/learn/subscapularis/"><link rel="stylesheet" href="/caidan-jiepou/learn/reading.css"></head><body><header><a href="/caidan-jiepou/">菜蛋解剖</a><nav><a href="/caidan-jiepou/learn/">学习目录</a><a href="/caidan-jiepou/">打开三维图谱</a></nav></header><main><p class="meta">上肢 · 肌肉</p><h1>肩胛下肌</h1><p class="intro">位于肩胛骨前面的肩胛下窝，是肩袖的组成肌之一。</p><a class="open" href="/caidan-jiepou/?structure=subscapularis">在三维图谱中学习</a><h2>起点</h2><p>肩胛下窝。</p><h2>止点</h2><p>肱骨小结节。</p><h2>主要动作</h2><p>肩关节内旋，并参与稳定。</p><h2>神经支配</h2><p>肩胛下神经。</p><h2>理解线索</h2><p>它位于肩胛骨前面。转到前方观察，比较止于小结节与其他肩袖肌止于大结节的区别。</p><h2>关联结构</h2><ul><li>起点所在骨：<a href="/caidan-jiepou/learn/scapula/">肩胛骨</a></li><li>止点所在骨：<a href="/caidan-jiepou/learn/humerus/">肱骨</a></li><li>支配神经：<a href="/caidan-jiepou/learn/subscapular-nerves/">肩胛下神经</a></li></ul><h2>教材参考与来源</h2><ul><li><a href="https://medicine.uams.edu/neuroscience/education/medical-school-courses/human-structure-module/anatomy-tables/muscle-tables/muscles-of-the-upper-limb/" rel="noreferrer">阿肯色医学科学大学 · 上肢肌解剖表</a></li></ul></main><footer>菜蛋解剖 · 骨肌神经学习<br>知识卡为教学摘要，来源可核对；图谱为静态成年男性参考模型。</footer></body></html>
