<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肌皮神经解剖学习 · 菜蛋解剖</title><meta name="description" content="臂丛分支，主要支配上臂前群肌。"><link rel="canonical" href="https://fky2181.github.io/caidan-jiepou/learn/musculocutaneous-nerve/"><link rel="stylesheet" href="/caidan-jiepou/learn/reading.css"></head><body><header><a href="/caidan-jiepou/">菜蛋解剖</a><nav><a href="/caidan-jiepou/learn/">学习目录</a><a href="/caidan-jiepou/">打开三维图谱</a></nav></header><main><p class="meta">上肢 · 神经</p><h1>肌皮神经</h1><p class="intro">臂丛分支，主要支配上臂前群肌。</p><a class="open" href="/caidan-jiepou/?structure=musculocutaneous-nerve">在三维图谱中学习</a><h2>认识这条神经</h2><p>臂丛分支，主要支配上臂前群肌。</p><h2>走行与联系</h2><p>穿过喙肱肌后，走行于肱二头肌与肱肌之间，远端续为前臂外侧皮神经。</p><h2>理解线索</h2><p>“肌”与“皮”分别提示运动分支和感觉分支，不能只按名称推断全部功能。</p><h2>关联结构</h2><ul><li>支配肌肉：<a href="/caidan-jiepou/learn/biceps/">肱二头肌</a></li><li>支配肌肉：<a href="/caidan-jiepou/learn/brachialis/">肱肌</a></li></ul><h2>教材参考与来源</h2><ul><li><a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/13-4-the-peripheral-nervous-system" rel="noreferrer">开放教材 · 周围神经系统</a></li><li><a href="https://medicine.uams.edu/neuroscience/education/medical-school-courses/human-structure-module/anatomy-tables/muscle-tables/muscles-of-the-upper-limb/" rel="noreferrer">阿肯色医学科学大学 · 上肢肌解剖表</a></li></ul></main><footer>菜蛋解剖 · 骨肌神经学习<br>知识卡为教学摘要，来源可核对；图谱为静态成年男性参考模型。</footer></body></html>
