<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>腓肠肌解剖学习 · 菜蛋解剖</title><meta name="description" content="小腿后方浅层的双头肌，跨膝和踝关节。"><link rel="canonical" href="https://fky2181.github.io/caidan-jiepou/learn/gastrocnemius/"><link rel="stylesheet" href="/caidan-jiepou/learn/reading.css"></head><body><header><a href="/caidan-jiepou/">菜蛋解剖</a><nav><a href="/caidan-jiepou/learn/">学习目录</a><a href="/caidan-jiepou/">打开三维图谱</a></nav></header><main><p class="meta">下肢 · 肌肉</p><h1>腓肠肌</h1><p class="intro">小腿后方浅层的双头肌，跨膝和踝关节。</p><a class="open" href="/caidan-jiepou/?structure=gastrocnemius">在三维图谱中学习</a><h2>起点</h2><p>股骨内、外侧髁附近。</p><h2>止点</h2><p>经跟腱止于跟骨。</p><h2>主要动作</h2><p>踝跖屈，并参与屈膝。</p><h2>神经支配</h2><p>胫神经。</p><h2>理解线索</h2><p>比较它与比目鱼肌跨过的关节：两者都可跖屈，但腓肠肌还跨过膝关节。</p><h2>关联结构</h2><ul><li>起点所在骨：<a href="/caidan-jiepou/learn/femur/">股骨</a></li><li>止点所在骨：<a href="/caidan-jiepou/learn/calcaneus/">跟骨</a></li><li>支配神经：<a href="/caidan-jiepou/learn/tibial-nerve/">胫神经</a></li></ul><h2>教材参考与来源</h2><ul><li><a href="https://medicine.uams.edu/neuroscience/education/medical-school-courses/human-structure-module/anatomy-tables/muscle-tables/muscles-of-the-lower-limb/" rel="noreferrer">阿肯色医学科学大学 · 下肢肌解剖表</a></li></ul></main><footer>菜蛋解剖 · 骨肌神经学习<br>知识卡为教学摘要，来源可核对；图谱为静态成年男性参考模型。</footer></body></html>
